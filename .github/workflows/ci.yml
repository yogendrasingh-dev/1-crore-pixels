name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/one_crore_pixels?schema=public"
  REDIS_URL: "redis://localhost:6379"
  UPI_VPA: "campaign@upi"
  UPI_PAYEE_NAME: "1 Crore Pixels"
  ADMIN_SESSION_SECRET: "ci-placeholder-secret-min-32-characters"
  MFA_ENCRYPTION_KEY: "ci-placeholder-secret-min-32-characters"
  PIXEL_WALL_WIDTH: "4000"
  PIXEL_CHUNK_ROWS: "25"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
